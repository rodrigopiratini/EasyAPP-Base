# Publica as funções do Supabase da fábrica (supabase/functions/*) no projeto easyapp-fabrica quando mudam na main.
# Precisa UMA vez do segredo SUPABASE_ACCESS_TOKEN neste repositório (supabase.com › Account › Access Tokens;
# GitHub › Settings › Secrets and variables › Actions). Sem ele, o workflow só avisa.
# Todas vão sem verificação de JWT: gestao-fabrica confere um segredo; assistente confere o login por dentro
# (a demonstração não tem login).
name: Funções

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/funcoes.yml']
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJETO: sizbmkvzcqiukprdlxxr
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Tem o token?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::falta o segredo SUPABASE_ACCESS_TOKEN: publique à mão (supabase functions deploy) ou crie o segredo"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then NOMES=$(ls supabase/functions)
          else NOMES=$(git diff --name-only HEAD~1 HEAD -- supabase/functions | cut -d/ -f3 | sort -u); fi
          [ -z "$NOMES" ] && { echo "nenhuma função mudou"; exit 0; }
          for f in $NOMES; do
            [ -f "supabase/functions/$f/index.ts" ] || continue
            echo "== $f"
            supabase functions deploy "$f" --project-ref "$PROJETO" --no-verify-jwt --yes
          done
